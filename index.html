<script type="module">
(async () => {
const statusEl0 = document.getElementById('gv-status');
let THREE, OrbitControls, RoomEnvironment;
try {
  THREE = await import('three');
  ({ OrbitControls } = await import('three/addons/controls/OrbitControls.js'));
  ({ RoomEnvironment } = await import('three/addons/environments/RoomEnvironment.js'));
} catch (e) { console.error(e); statusEl0.classList.add('error'); statusEl0.textContent = 'Não foi possível carregar o modelo 3D agora.'; return; }



// Gol G5 aproximado: carroceria gerada por loft de seções transversais.
// Medidas tiradas do desenho enviado (frente +X, chão em Y=0, unidades em metros).
const L = 3.9, K = 20;
const V2 = (a) => a.map(([x, y]) => new THREE.Vector2(x, y));

function prof(tbl) {
  const s = new THREE.SplineCurve(V2(tbl)).getPoints(300);
  return (u) => {
    if (u <= s[0].x) return s[0].y;
    for (let i = 1; i < s.length; i++) if (u <= s[i].x) {
      const a = s[i - 1], b = s[i];
      return a.y + (b.y - a.y) * (u - a.x) / (b.x - a.x || 1);
    }
    return s[s.length - 1].y;
  };
}
// u = 0 (frente) → 1 (traseira)
const TOP = prof([[0,.583],[.025,.79],[.05,.86],[.1,.927],[.15,.973],[.2,1.009],[.25,1.04],[.285,1.063],[.33,1.02],[.4,1.0],[.6,1.0],[.8,.99],[.9,.97],[.94,.96],[.96,.955],[.975,.95],[.99,.8],[1,.618]]);
const BOT = prof([[0,.45],[.02,.33],[.05,.27],[.1,.25],[.3,.25],[.5,.25],[.7,.25],[.9,.25],[.95,.27],[.98,.31],[1,.4]]);
const WID = prof([[0,.74],[.03,.82],[.08,.855],[.2,.875],[.4,.875],[.6,.875],[.8,.875],[.9,.85],[.96,.8],[1,.74]]);
const ROOF = prof([[.285,1.063],[.3,1.122],[.35,1.228],[.4,1.329],[.45,1.404],[.5,1.439],[.55,1.454],[.6,1.458],[.7,1.45],[.8,1.415],[.85,1.385],[.88,1.34],[.9,1.26],[.925,1.165],[.95,1.07],[.975,.95]]);
const WHEEL_X = [0.19, 0.86].map((u) => (0.5 - u) * L);
const WHEEL_Y = 0.3, WHEEL_Z = 0.735;

function bodyRing(u) {
  const x = (0.5 - u) * L, yb = BOT(u), yt = TOP(u), w = WID(u), h = yt - yb;
  const half = new THREE.SplineCurve(V2([
    [0, yb], [.78*w, yb], [.96*w, yb + .07], [w, yb + .38*h], [.985*w, yb + .72*h],
    [.88*w, yt - .025], [.55*w, yt - .004], [.2*w, yt], [0, yt + .012],
  ])).getPoints(K);
  const pts = half.map((p) => {
    let z = p.x, d = 99, flag = 0;
    for (const xc of WHEEL_X) d = Math.min(d, Math.hypot(x - xc, p.y - WHEEL_Y));
    if (d < 0.38) { z = Math.max(0, z - 0.13 * Math.min(1, (1 - d / 0.38) * 3)); if (d < 0.36) flag = 1; }
    return new THREE.Vector3(z, p.y, flag);
  });
  const left = pts.slice(0, K).reverse().map((p) => new THREE.Vector3(-p.x, p.y, p.z));
  return [...pts, ...left];
}

function ghRing(u) {
  const yb = TOP(u), yt = Math.max(ROOF(u), yb), h = yt - yb;
  const wb = WID(u) - 0.12, wr = Math.min(0.57, wb - 0.05);
  const half = new THREE.SplineCurve(V2([
    [0, yt], [.6*wr, yt - .008], [wr, yt - .1*h - .01], [(wr + wb)/2 + .015, yb + .45*h], [wb, yb],
  ])).getPoints(K);
  const right = half.map((p) => new THREE.Vector3(p.x, p.y, 0));
  const left = half.slice(1).reverse().map((p) => new THREE.Vector3(-p.x, p.y, 0));
  return [...left, ...right];
}

function loft(nU, u0, u1, ringFn, i0, i1, o = {}) {
  const pos = [], col = [], idx = [], cols = i1 - i0 + 1;
  const rows = [];
  for (let a = 0; a <= nU; a++) {
    const u = u0 + (u1 - u0) * a / nU, ring = ringFn(u), x = (0.5 - u) * L;
    rows.push([]);
    for (let j = i0; j <= i1; j++) {
      const p = ring[j];
      let y = p.y, z = p.x;
      if (o.offset) {
        const dy = y - (o.cy || .9), n = Math.hypot(dy, z) || 1;
        y += dy / n * o.offset; z += z / n * o.offset;
      }
      pos.push(x, y, z);
      const c = o.color ? o.color(u, p) : [1, 1, 1];
      col.push(...c);
      rows[a].push(pos.length / 3 - 1);
    }
    if (o.caps && (a === 0 || a === nU)) { /* centro calculado abaixo */ }
  }
  for (let a = 0; a < nU; a++) for (let j = 0; j < cols - 1; j++) {
    const a0 = a * cols + j, a1 = a0 + 1, b0 = a0 + cols, b1 = b0 + 1;
    idx.push(a0, b0, a1, a1, b0, b1);
  }
  if (o.caps) for (const a of [0, nU]) {
    let cx = 0, cy = 0, cz = 0;
    rows[a].forEach((i) => { cx += pos[i*3]; cy += pos[i*3+1]; cz += pos[i*3+2]; });
    const n = rows[a].length, c = pos.length / 3;
    pos.push(cx / n, cy / n, cz / n); col.push(.96, .96, .94);
    for (let j = 0; j < n - 1; j++) idx.push(c, rows[a][j], rows[a][j + 1]);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function buildApproxGol() {
  const car = new THREE.Group();
  car.name = 'gol-g5-2010-aprox';
  const M = 2 * K + 1;

  const paint = new THREE.MeshPhysicalMaterial({
    color: 0xffffff, vertexColors: true, metalness: 0.15, roughness: 0.3,
    clearcoat: 1, clearcoatRoughness: 0.06, side: THREE.DoubleSide,
  });
  const white = new THREE.MeshPhysicalMaterial({ color: 0xf4f4f1, metalness: 0.15, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.06, side: THREE.DoubleSide });
  const glass = new THREE.MeshPhysicalMaterial({ color: 0x10171c, metalness: 0, roughness: 0.04, clearcoat: 1, envMapIntensity: 1.6, side: THREE.DoubleSide });
  const black = new THREE.MeshStandardMaterial({ color: 0x0b0b0d, roughness: 0.6 });
  const rubber = new THREE.MeshStandardMaterial({ color: 0x121212, roughness: 0.85, side: THREE.DoubleSide });
  const chrome = new THREE.MeshStandardMaterial({ color: 0xcfd4da, metalness: 1, roughness: 0.25 });
  const lens = new THREE.MeshPhysicalMaterial({ color: 0xe6edf0, roughness: 0.05, metalness: 0.3, clearcoat: 1 });
  const red = new THREE.MeshStandardMaterial({ color: 0x9c0e0e, emissive: 0x2a0000, roughness: 0.2 });
  const gray = new THREE.MeshStandardMaterial({ color: 0x30343a, roughness: 0.7 });
  const plate = new THREE.MeshStandardMaterial({ color: 0xf2f2f2, roughness: 0.5 });

  // Carroceria
  const bodyColor = (u, p) => {
    const dark = p.z > 0.5 || p.y < BOT(u) + 0.045 || ((u < 0.09 || u > 0.915) && p.y < BOT(u) + 0.15);
    return dark ? [0.05, 0.05, 0.06] : [0.96, 0.96, 0.94];
  };
  car.add(new THREE.Mesh(loft(200, 0, 1, bodyRing, 0, M - 1, { caps: true, color: bodyColor }), paint));

  // Cabine (teto + colunas) e vidros
  car.add(new THREE.Mesh(loft(140, 0.285, 0.975, ghRing, 0, M - 1), white));
  const cl = (v) => Math.min(0.975, Math.max(0.285, v));
  const win = (u0, u1, i0, i1, n = 40) => {
    car.add(new THREE.Mesh(loft(n, cl(u0 - .012), cl(u1 + .012), ghRing, Math.max(0, i0 - 1), Math.min(M - 1, i1 + 1), { offset: 0.002 }), black));
    car.add(new THREE.Mesh(loft(n, u0, u1, ghRing, i0, i1, { offset: 0.004 }), glass));
  };
  win(0.29, 0.43, 2, M - 3);              // para-brisa
  win(0.905, 0.968, 2, M - 3, 16);         // vidro traseiro
  win(0.37, 0.567, K + 11, K + 19); win(0.37, 0.567, K - 19, K - 11);
  win(0.611, 0.84, K + 11, K + 19);  win(0.611, 0.84, K - 19, K - 11);

  const add = (geo, mat, x, y, z, rot) => {
    const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
    if (rot) m.rotation.set(...rot); car.add(m); return m;
  };
  const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
  const tex = (w, h, draw) => {
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h; draw(cv.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
  };
  const plateTex = tex(512, 128, (g, w, h) => {
    g.fillStyle = '#f4f4f2'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#1f4e9c'; g.fillRect(0, 0, w, 26);
    g.fillStyle = '#fff'; g.font = 'bold 20px sans-serif'; g.textAlign = 'center'; g.fillText('BRASIL', w / 2, 20);
    g.fillStyle = '#111'; g.font = 'bold 74px sans-serif'; g.fillText('BRA 2E10', w / 2, 104);
    g.strokeStyle = '#222'; g.lineWidth = 6; g.strokeRect(3, 3, w - 6, h - 6);
  });
  const logoTex = tex(128, 128, (g) => {
    g.fillStyle = '#cfd4da'; g.beginPath(); g.arc(64, 64, 62, 0, 7); g.fill();
    g.fillStyle = '#0b2a6b'; g.beginPath(); g.arc(64, 64, 50, 0, 7); g.fill();
    g.fillStyle = '#fff'; g.font = 'bold 56px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('VW', 64, 68);
  });
  const golTex = tex(256, 96, (g) => {
    g.fillStyle = '#2a2a2a'; g.font = 'italic bold 78px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('GOL', 128, 52);
  });
  const plateMat = new THREE.MeshStandardMaterial({ map: plateTex, roughness: 0.45 });
  const logoMat = new THREE.MeshStandardMaterial({ map: logoTex, metalness: 0.4, roughness: 0.3 });
  const golMat = new THREE.MeshStandardMaterial({ map: golTex, transparent: true, roughness: 0.4 });
  const lensClear = new THREE.MeshPhysicalMaterial({ color: 0xf2f6f8, roughness: 0.03, clearcoat: 1, transparent: true, opacity: 0.38, depthWrite: false });
  const amber = new THREE.MeshStandardMaterial({ color: 0xff9a1a, emissive: 0x552200, roughness: 0.3 });
  const bulb = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x888888 });
  const tailRed = new THREE.MeshPhysicalMaterial({ color: 0xa30f0f, emissive: 0x3a0000, roughness: 0.12, clearcoat: 1 });
  const flat = (w, h, m, x, y, z, ry) => add(new THREE.PlaneGeometry(w, h), m, x, y, z, [0, ry, 0]);

  // Rodas: pneu arredondado, calota de 8 furos, cubo central
  const tireGeo = new THREE.LatheGeometry([[.205,-.085],[.255,-.09],[.29,-.075],[.302,-.04],[.304,0],[.302,.04],[.29,.075],[.255,.09],[.205,.085]]
    .map(([r, y]) => new THREE.Vector2(r, y)), 48);
  const wheel = () => {
    const g = new THREE.Group();
    const tire = new THREE.Mesh(tireGeo, rubber); tire.rotation.x = Math.PI / 2; g.add(tire);
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.205, 0.205, 0.19, 40), chrome); hub.rotation.x = Math.PI / 2; g.add(hub);
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.2, 24), gray); cap.rotation.x = Math.PI / 2; g.add(cap);
    for (const s of [1, -1]) for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2 + Math.PI / 8;
      const slot = new THREE.Mesh(box(0.05, 0.11, 0.004), gray);
      slot.position.set(Math.cos(a) * 0.125, Math.sin(a) * 0.125, s * 0.0985);
      slot.rotation.z = a - Math.PI / 2; g.add(slot);
    }
    return g;
  };
  for (const x of WHEEL_X) for (const s of [1, -1]) {
    const w = wheel(); w.position.set(x, WHEEL_Y, s * WHEEL_Z); car.add(w);
  }

  // Frente: grade, logo, placa, faróis com refletor, setas, faróis de milha
  add(box(0.03, 0.13, 0.85), black, 1.935, 0.62, 0);
  add(box(0.02, 0.012, 0.85), chrome, 1.945, 0.69, 0);
  flat(0.1, 0.1, logoMat, 1.952, 0.62, 0, Math.PI / 2);
  flat(0.4, 0.1, plateMat, 1.948, 0.5, 0, Math.PI / 2);
  for (const s of [1, -1]) {
    const ry = -s * 0.35;
    add(new THREE.SphereGeometry(1, 24, 16), black, 1.845, 0.70, s * 0.65, [0, ry, 0]).scale.set(0.05, 0.065, 0.17);
    add(new THREE.SphereGeometry(1, 20, 14), chrome, 1.855, 0.70, s * 0.645, [0, ry, 0]).scale.set(0.045, 0.055, 0.14);
    for (const dz of [-0.04, 0.05]) add(new THREE.SphereGeometry(0.03, 16, 12), bulb, 1.88, 0.70, s * (0.65 + dz));
    add(new THREE.SphereGeometry(1, 24, 16), lensClear, 1.865, 0.70, s * 0.65, [0, ry, 0]).scale.set(0.06, 0.075, 0.18);
    add(box(0.02, 0.03, 0.07), amber, 1.87, 0.66, s * 0.76, [0, ry, 0]);
    add(new THREE.CylinderGeometry(0.04, 0.04, 0.03, 20), black, 1.84, 0.33, s * 0.69, [0, 0, Math.PI / 2]);
    add(new THREE.CylinderGeometry(0.022, 0.022, 0.032, 16), lens, 1.842, 0.33, s * 0.69, [0, 0, Math.PI / 2]);
  }

  // Traseira: lanternas em camadas, logo, GOL, placa, escapamento
  flat(0.09, 0.09, logoMat, -1.957, 0.62, 0, -Math.PI / 2);
  flat(0.2, 0.075, golMat, -1.957, 0.64, -0.4, -Math.PI / 2);
  flat(0.4, 0.1, plateMat, -1.957, 0.5, 0, -Math.PI / 2);
  for (const s of [1, -1]) {
    add(box(0.06, 0.14, 0.2), tailRed, -1.915, 0.74, s * 0.58);
    add(box(0.063, 0.03, 0.07), amber, -1.915, 0.775, s * 0.65);
    add(box(0.063, 0.03, 0.07), bulb, -1.915, 0.7, s * 0.52);
  }
  add(new THREE.CylinderGeometry(0.03, 0.03, 0.12, 16), gray, -1.9, 0.27, 0.3, [0, 0, Math.PI / 2]);

  // Laterais: retrovisores, maçanetas cromadas, frestas, soleiras
  for (const s of [1, -1]) {
    add(new THREE.SphereGeometry(1, 20, 14), black, 0.56, 1.01, s * 0.87).scale.set(0.07, 0.05, 0.07);
    add(box(0.05, 0.02, 0.1), black, 0.58, 0.97, s * 0.82);
    for (const x of [-0.16, -1.11]) {
      add(box(0.14, 0.035, 0.03), black, x, 0.79, s * 0.835);
      add(box(0.12, 0.015, 0.012), chrome, x, 0.795, s * 0.852);
    }
    for (const x of [0.78, -0.31, -1.3]) add(box(0.006, 0.46, 0.004), gray, x, 0.62, s * 0.828);
    add(box(2.0, 0.035, 0.02), black, -0.1, 0.3, s * 0.84);
  }

  // Teto: aerofólio com luz de freio, antena, limpadores
  add(box(0.18, 0.02, 0.9), white, -1.47, 1.385, 0, [0, 0, 0.08]);
  add(box(0.012, 0.014, 0.5), tailRed, -1.565, 1.375, 0);
  add(new THREE.CylinderGeometry(0.004, 0.004, 0.22, 8), black, -1.15, 1.54, 0, [0, 0, 0.78]);
  const wu = 0.322;
  for (const s of [1, -1]) add(box(0.012, 0.008, 0.5), black, (0.5 - wu) * L, ROOF(wu) + 0.014, s * 0.22, [0, s * 0.12, 0.58]);

  car.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  return car;
}


// ---------- Configuração ----------
const AUTO_ROTATE_SPEED = 1.2;   // menor = mais lento
const CAR_LENGTH = 4;            // unidades da cena (o modelo é redimensionado)

// Pintura branca: deixe false se o GLB já vier branco.
// Se vier de outra cor, coloque true e ajuste PAINT_NAMES com o nome do material da lataria.
const FORCE_WHITE_PAINT = false;
const PAINT_NAMES = ['paint', 'body', 'carpaint', 'lataria', 'car_paint'];

// ---------- Cena ----------
const holder = document.getElementById('gv-canvas');
const statusEl = document.getElementById('gv-status');
const pctEl = document.getElementById('gv-pct');
const btnReset = document.getElementById('gv-reset');
const btnRotate = document.getElementById('gv-rotate');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
holder.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(4, 6, 3);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
Object.assign(key.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 0.5, far: 20 });
key.shadow.bias = -0.0005;
scene.add(key);

const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.enablePan = false;
controls.maxPolarAngle = Math.PI / 2 - 0.02; // não deixa a câmera passar do chão
controls.autoRotate = true;
controls.autoRotateSpeed = AUTO_ROTATE_SPEED;
renderer.domElement.style.touchAction = 'pan-y'; // deslizar na vertical continua rolando a página

// Chão que só recebe sombra
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: 0.22 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f99, 0.35));
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.55);
fill.position.set(-5, 3, -4);
scene.add(fill);

// sombra de contato suave sob o carro
const cs = document.createElement('canvas'); cs.width = cs.height = 256;
const cg = cs.getContext('2d'), gr = cg.createRadialGradient(128, 128, 10, 128, 128, 128);
gr.addColorStop(0, 'rgba(0,0,0,.6)'); gr.addColorStop(.55, 'rgba(0,0,0,.3)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
cg.fillStyle = gr; cg.fillRect(0, 0, 256, 256);
const contact = new THREE.Mesh(new THREE.PlaneGeometry(5.4, 2.7),
  new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cs), transparent: true, depthWrite: false }));
contact.rotation.x = -Math.PI / 2; contact.position.y = 0.003;
scene.add(contact);

// ---------- Estado de rotação / botões ----------
function setRotating(on) {
  controls.autoRotate = on;
  btnRotate.textContent = on ? 'Pausar rotação' : 'Retomar rotação';
  btnRotate.setAttribute('aria-pressed', String(on));
}
btnRotate.addEventListener('click', () => setRotating(!controls.autoRotate));
controls.addEventListener('start', () => setRotating(false)); // interage = pausa

const home = { pos: new THREE.Vector3(), target: new THREE.Vector3() };
btnReset.addEventListener('click', () => {
  camera.position.copy(home.pos);
  controls.target.copy(home.target);
  controls.update();
  setRotating(true);
});

// ---------- Carregamento ----------
function showError(msg) {
  statusEl.classList.add('error');
  statusEl.textContent = msg;
}

function placeCar(car) {

    // Redimensiona e centraliza no chão
    let box = new THREE.Box3().setFromObject(car);
    const size = box.getSize(new THREE.Vector3());
    const scale = CAR_LENGTH / Math.max(size.x, size.z);
    car.scale.setScalar(scale);
    box = new THREE.Box3().setFromObject(car);
    const center = box.getCenter(new THREE.Vector3());
    car.position.x -= center.x;
    car.position.z -= center.z;
    car.position.y -= box.min.y;

    car.traverse((o) => {
      if (!o.isMesh) return;
      o.castShadow = true;
      o.frustumCulled = false; // evita sumir em certos ângulos
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach((m) => {
        if (m.map) m.map.anisotropy = renderer.capabilities.getMaxAnisotropy();
        if (FORCE_WHITE_PAINT && PAINT_NAMES.some((n) => (m.name || '').toLowerCase().includes(n))) {
          m.color.set(0xf5f5f2);
          if ('metalness' in m) { m.metalness = 0.5; m.roughness = 0.25; }
          if ('clearcoat' in m) m.clearcoat = 1;
        }
      });
    });
    scene.add(car);

    // Enquadramento inicial (diagonal frontal)
    const h = new THREE.Box3().setFromObject(car).getSize(new THREE.Vector3()).y;
    home.target.set(0, h * 0.45, 0);
    home.pos.set(CAR_LENGTH * 0.95, h * 1.1, CAR_LENGTH * 1.15);
    camera.position.copy(home.pos);
    controls.target.copy(home.target);
    controls.minDistance = CAR_LENGTH * 0.6;
    controls.maxDistance = CAR_LENGTH * 3;
    controls.update();

    statusEl.classList.add('hidden');
}

// Sem GLB na pasta: usa a malha aproximada gerada por código (feita a partir do desenho de referência)
function useApprox() {
  const car = buildApproxGol();
  placeCar(car);
  document.querySelector('.gv-head p').textContent = 'Modelo 3D interativo';
}

try { useApprox(); } catch (err) { console.error(err); showError('Erro ao montar o modelo.'); }

// ---------- Responsivo ----------
function resize() {
  const w = holder.clientWidth, h = holder.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // em telas estreitas, afasta um pouco para o carro caber
  camera.fov = w / h < 0.8 ? 48 : 35;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(holder);
resize();

renderer.setAnimationLoop(() => {
  if (!document.body.classList.contains('car')) return;
  controls.update();
  renderer.render(scene, camera);
});

})();
</script>
